<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="APPS &amp; SAAS: macOS · Windows · iOS">
<style>
.s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.fade { animation: fade .6s ease both; }
.pop  { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop  { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.swing { animation: swing .9s cubic-bezier(.2,1.4,.4,1) both; transform-origin: 50% 100%; transform-box: view-box; }
@keyframes swing { from { opacity: 0; transform: translateY(70px) rotate(-6deg); } to { opacity: 1; transform: none; } }
.nudge { animation: nudge 1.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes nudge { 0%,100% { transform: none; } 50% { transform: translateX(6px); } }
</style>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0b36"/><stop offset="1" stop-color="#2a0f52"/></linearGradient>
    <linearGradient id="tshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="50">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ececf4"/><stop offset="1" stop-color="#b9b9cc"/>
    </linearGradient>
    <linearGradient id="glossLine" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="50">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c3d4"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <clipPath id="tc"><rect x="6" y="6" width="388" height="248" rx="20"/></clipPath>
    <clipPath id="bc"><rect x="30" y="30" width="72" height="72" rx="18"/></clipPath>
  </defs>
  <g class="swing" style="animation-delay:0.38s">
    <rect x="6" y="6" width="388" height="248" rx="20" fill="url(#tbg)" stroke="#6d28d9" stroke-opacity=".8" stroke-width="1.5"/>
    <g clip-path="url(#tc)">
      <rect x="-240" y="0" width="200" height="260" fill="url(#tshine)" transform="skewX(-18)"><animate attributeName="x" values="-240;640;640" keyTimes="0;.35;1" dur="5s" begin="1.8s" repeatCount="indefinite"/></rect>
    </g>

    <!-- app-style badge: purple tile, glossy white icon, a glint sweeping across -->
    <rect x="30" y="30" width="72" height="72" rx="18" fill="url(#badge)"/>
    <rect x="30" y="30" width="72" height="36" rx="18" fill="#ffffff" fill-opacity=".1"/>
    <g transform="translate(38 38)"><g fill="none" stroke="url(#glossLine)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16L6 28l12 12"/><path d="M38 16l12 12-12 12"/><path d="M32 11l-8 34"/></g></g>
    <g clip-path="url(#bc)"><rect x="-30" y="20" width="22" height="100" fill="url(#glint)" transform="skewX(-20)"><animate attributeName="x" values="-30;80;80" keyTimes="0;.3;1" dur="4s" begin="1.4s" repeatCount="indefinite"/></rect></g>

    <text class="m" x="36" y="134" font-size="14" font-weight="700" fill="#d6d6e4" letter-spacing="3">APPS &amp; SAAS</text>
    <text class="s" x="34" y="172" font-size="29" font-weight="800" fill="#ffffff">macOS · Windows · iOS</text>
    <text class="s" x="36" y="204" font-size="17" fill="#a3a3b8">Native apps, desktop software, web</text>
    <text class="s nudge" x="342" y="214" font-size="26" font-weight="800" fill="#d6d6e4">→</text>
  </g>
</svg>
