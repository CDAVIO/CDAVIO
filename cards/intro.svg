<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Cristea David. Deaf, founder of CDAV.IO, building a trading super intelligence">
<style>
.s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.fade { animation: fade .6s ease both; }
.pop  { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop  { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0418"/><stop offset=".6" stop-color="#1c0b36"/><stop offset="1" stop-color="#2a0f52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy=".45" r=".55">
      <stop offset="0" stop-color="#6d28d9" stop-opacity=".45"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <defs>
      <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#ffd905"/><stop offset=".58" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1.6 0;1.6 0" keyTimes="0;.45;1" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
      </linearGradient>
      <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#4c1d95" stop-opacity=".12"/></linearGradient>
      <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d28d9" stop-opacity=".6"/><stop offset="1" stop-color="#2e1065" stop-opacity=".4"/></linearGradient>
      <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b0f7a"/><stop offset="1" stop-color="#0c0418"/></linearGradient>
    </defs>

    <!-- copy -->
    <text class="s rise" style="animation-delay:0.20s" x="600" y="148" text-anchor="middle" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Cristea <tspan fill="url(#shine)">David</tspan></text>
    <text class="s rise" style="animation-delay:0.45s" x="600" y="202" text-anchor="middle" font-size="27" font-weight="600" fill="#c4b5fd">Deaf · Founder of <tspan fill="#ffffff">CDAV.</tspan><tspan fill="#ffd905">IO</tspan></text>
    <text class="s rise" style="animation-delay:0.65s" x="600" y="240" text-anchor="middle" font-size="27" font-weight="600" fill="#ffffff">Building a trading <tspan fill="#ffd905">super intelligence</tspan></text>
    <g class="pop" style="animation-delay:1.00s"><rect x="354" y="262" width="104" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".45"/><text class="s" x="406" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Game dev</text></g><g class="pop" style="animation-delay:1.12s"><rect x="470" y="262" width="124" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".45"/><text class="s" x="532" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Web &amp; SaaS</text></g><g class="pop" style="animation-delay:1.24s"><rect x="606" y="262" width="134" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".45"/><text class="s" x="673" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">AI &amp; Python</text></g><g class="pop" style="animation-delay:1.36s"><rect x="752" y="262" width="93" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".45"/><text class="s" x="799" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Trading</text></g>

    <!-- water: each path holds two identical 1200px periods and slides by one -->
    <path fill="url(#w1)" d="M0 336 C150 318 300 318 450 336 S750 354 900 336 S1050 318 1200 336 C1350 318 1500 318 1650 336 S1950 354 2100 336 S2250 318 2400 336 V380 H0Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="16s" repeatCount="indefinite"/></path>
    <path fill="url(#w2)" d="M0 350 C200 334 400 366 600 350 S1000 334 1200 350 C1400 334 1600 366 1800 350 S2200 334 2400 350 V380 H0Z"><animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="12s" repeatCount="indefinite"/></path>
    <path fill="url(#w3)" d="M0 364 C150 356 300 372 450 364 S750 356 900 364 S1050 372 1200 364 C1350 356 1500 372 1650 364 S1950 356 2100 364 S2250 372 2400 364 V380 H0Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/></path>
  </g>
</svg>
