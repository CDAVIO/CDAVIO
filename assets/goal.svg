<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="I build. Goal: Trading Super Intelligence, loading">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0418"/>
      <stop offset=".6" stop-color="#1c0b36"/>
      <stop offset="1" stop-color="#2a0f52"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ffd905"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".5" r=".35">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="260" rx="22"/></clipPath>
    <clipPath id="bar"><rect x="300" y="168" width="640" height="16" rx="8"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { stroke: #a78bfa; stroke-opacity: .35; stroke-width: 1.5; }
      .node { fill: #1c0b36; stroke: #c4b5fd; stroke-width: 2; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- neural network brain -->
    <g transform="translate(60 40)">
      <g class="edge">
        <line x1="20" y1="40" x2="100" y2="20"/><line x1="20" y1="40" x2="100" y2="90"/>
        <line x1="20" y1="90" x2="100" y2="20"/><line x1="20" y1="90" x2="100" y2="90"/><line x1="20" y1="90" x2="100" y2="160"/>
        <line x1="20" y1="140" x2="100" y2="90"/><line x1="20" y1="140" x2="100" y2="160"/>
        <line x1="100" y1="20" x2="180" y2="90"/><line x1="100" y1="90" x2="180" y2="90"/><line x1="100" y1="160" x2="180" y2="90"/>
      </g>
      <!-- signal pulses travelling along edges -->
      <g fill="#ffd905">
        <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M20 90 L100 20 L180 90"/></circle>
        <circle r="3.5"><animateMotion dur="2.4s" begin="-.8s" repeatCount="indefinite" path="M20 40 L100 90 L180 90"/></circle>
        <circle r="3.5"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M20 140 L100 160 L180 90"/></circle>
      </g>
      <g>
        <circle class="node" cx="20" cy="40" r="9"/>
        <circle class="node" cx="20" cy="90" r="9"/>
        <circle class="node" cx="20" cy="140" r="9"/>
        <circle class="node" cx="100" cy="20" r="9"/>
        <circle class="node" cx="100" cy="90" r="9"/>
        <circle class="node" cx="100" cy="160" r="9"/>
      </g>
      <circle cx="180" cy="90" r="16" fill="#ffd905">
        <animate attributeName="r" values="14;18;14" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="90" r="16" fill="none" stroke="#ffd905" stroke-width="2">
        <animate attributeName="r" values="16;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- copy -->
    <text class="m" x="300" y="66" font-size="17" font-weight="700" fill="#ffd905" letter-spacing="3">I BUILD · GOAL</text>
    <text class="t" x="300" y="118" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">Trading Super Intelligence</text>

    <!-- status line: cycles through four phases -->
    <g class="m" font-size="18" fill="#c4b5fd">
      <text x="300" y="152" opacity="0">Reading markets…<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.24;.25;1" dur="8s" repeatCount="indefinite"/></text>
      <text x="300" y="152" opacity="0">Learning structure…<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.26;.49;.5;1" dur="8s" repeatCount="indefinite"/></text>
      <text x="300" y="152" opacity="0">Managing risk…<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.51;.74;.75;1" dur="8s" repeatCount="indefinite"/></text>
      <text x="300" y="152" opacity="0">Executing with discipline…<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.75;.76;1" dur="8s" repeatCount="indefinite"/></text>
    </g>
    <text class="m" x="940" y="152" font-size="17" font-weight="700" fill="#ffd905" text-anchor="end">LOADING
      <tspan>.<animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.25;.5;1" dur="1.6s" repeatCount="indefinite"/></tspan><tspan>.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.75;1" dur="1.6s" repeatCount="indefinite"/></tspan><tspan>.<animate attributeName="opacity" values="0;0;0;1" keyTimes="0;.5;.75;1" dur="1.6s" repeatCount="indefinite"/></tspan>
    </text>

    <!-- progress bar -->
    <rect x="300" y="168" width="640" height="16" rx="8" fill="#ffffff" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/>
    <g clip-path="url(#bar)">
      <rect x="300" y="168" width="0" height="16" fill="url(#fill)">
        <animate attributeName="width" values="0;640;640" keyTimes="0;.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="180" y="168" width="120" height="16" fill="url(#shine)">
        <animate attributeName="x" values="180;940" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text class="m" x="300" y="218" font-size="16" fill="#8b7fb0" letter-spacing="1">market structure · risk · psychology · execution</text>
  </g>
</svg>
